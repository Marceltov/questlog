name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", mkdocs.yml]
  pull_request:
    paths-ignore: ["docs/**", mkdocs.yml]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # A push to main publishes ghcr.io/marceltov/questlog:main, only once check passed in the same run, so an untested image is
  # never :main. Only this job may write packages; the rest of the workflow stays read-only.
  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/marceltov/questlog:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
