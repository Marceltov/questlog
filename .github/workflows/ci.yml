name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", mkdocs.yml]
  pull_request:
    paths-ignore: ["docs/**", mkdocs.yml]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The committed openapi.json must match the route table.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate
      # --porcelain also catches files the generator added that aren't committed yet.
      - name: Generated files are current
        run: test -z "$(git status --porcelain)" || { git status --short; echo "::error::Generated files are stale. Run npm run generate and commit."; exit 1; }
      - run: npx -y @redocly/cli@2.57.0 lint openapi.json
      
  # A push to main publishes ghcr.io/marceltov/questlog:main, only once check passed in the same run, so an untested image is
  # never :main. Only this job may write packages; the rest of the workflow stays read-only.
  image:
    if: github.event_name == 'push'
    needs: [check, generate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/marceltov/questlog:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
