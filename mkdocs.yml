site_name: questlog
site_description: A spoiler-free quest log, build tracker and item list for the games you play. You tell Claude while you play; questlog remembers, and never shows what you haven't found.
site_url: https://questlog.marceltov.de/
repo_url: https://github.com/Marceltov/questlog
repo_name: Marceltov/questlog
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a>

hooks:
  - docs_hooks/roadmap.py

# English is the site; German pages sit next to their English ones (index.de.md) and are built under /de/. A page with no German version
# shows the English one there (#10).
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: Ein spoilerfreies Questlog, Build-Tracker und Inventar für die Spiele, die du spielst. Du erzählst es Claude beim Spielen; questlog merkt es sich und zeigt nie, was du noch nicht gefunden hast.
          nav_translations:
            Home: Start
            What questlog stands for: Wofür questlog steht
            Where questlog is going: Wohin questlog geht
            Self-hosting: Selbst hosten
            Configuration: Konfiguration
            Connect Claude: Claude verbinden
            Reference: Referenz
            MCP tools: MCP-Werkzeuge
            Internals: Interna
            How it works: Wie es funktioniert
            Development: Entwicklung
            Decisions: Entscheidungen

nav:
  - Home: index.md
  - What questlog stands for: values.md
  - Where questlog is going: roadmap.md
  - Self-hosting:
      - Configuration: self-hosting/configuration.md
      - Connect Claude: self-hosting/connect-claude.md
  - Reference:
      - MCP tools: reference/mcp-tools.md
      - REST API: reference/rest-api.md
  - Internals:
      - How it works: internals/how-it-works.md
      - Development: internals/development.md
  - Decisions:
      - AI-first game tracker with a built-in MCP: adr/0001-ai-first-game-tracker-with-built-in-mcp.md
      - On-demand lookups, no crawling (superseded): adr/0002-on-demand-lookups-not-crawling.md
      - Sign-in through a TypeScript mcp-login-oauth (superseded): adr/0003-sign-in-through-a-typescript-mcp-login-oauth.md
      - Sign-in with Better Auth: adr/0004-sign-in-with-better-auth.md
      - Spoiler levels and one gate: adr/0005-spoiler-levels-and-one-gate.md
      - How Better Auth is wired: adr/0006-better-auth-wiring.md
      - The REST API's tokens: adr/0007-rest-api-tokens.md
      - Claude looks things up: adr/0008-claude-looks-things-up.md
      - Goals and the character: adr/0009-goals-and-the-character.md
      - The tracker, inventory and codex: adr/0010-the-tracker.md
      - Notes and descriptions: adr/0011-notes-and-descriptions.md
      - Icons from lucide: adr/0012-icons.md
      - The in-app chat: adr/0013-in-app-chat.md

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # No navigation.instant: the language switch keeps you on the same page only without it (mkdocs-static-i18n).
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_javascript:
  # Pinned: Material otherwise loads the newest Mermaid 11, whose markup its styles don't all match (javascripts/mermaid.js).
  - https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
