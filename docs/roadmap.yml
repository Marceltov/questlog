# The roadmap, as data. docs_hooks/roadmap.py (from engineering-conventions, which has it from passageway) renders it as the timeline on
# the roadmap page.
#
# Open entries (status now, next, later or decide) are shown first, in the order of this file, each with a `when` label and `details`.
# Done entries are shown below them, newest date first (the order of this file breaks ties), each with a `date` and a link to its pull
# request or release.
#
# To finish a step: set `status: done`, replace `when` with `date: YYYY-MM-DD`, add the link to its pull request, and move it to the
# top of the done entries. `icon` is the name of a Material Design icon (https://pictogrammers.com/library/mdi/).
# `details` is a small subset of markdown: paragraphs, "- " lists, **bold**, `code` and [links](https://...).

items:
  # ---- open ------------------------------------------------------------------------------------------------------------
  - id: passkeys
    status: later
    when: Later
    icon: key-variant
    title: Passkeys and magic links
    summary: More ways to sign in, set up while signed in; a mail still holds only a code during an MCP sign-in.
    links:
      - { label: "#6", url: "https://github.com/Marceltov/questlog/issues/6" }
      - { label: "V7", url: "https://questlog.marceltov.de/values/#v7-self-hosting-has-everything" }

  - id: inventory
    status: next
    when: Next
    icon: bag-personal-outline
    title: The whole inventory
    summary: Weapons, armour, consumables, upgrade materials and collectibles, with quantities and an item's numbers as data, grouped by kind.
    links:
      - { label: "#24", url: "https://github.com/Marceltov/questlog/issues/24" }
      - { label: "V8", url: "https://questlog.marceltov.de/values/" }

  - id: world
    status: later
    when: Later
    icon: account-group-outline
    title: Bosses, NPCs and places
    summary: Kept as the player meets them, not only as names in quest logs; beaten, met, reached, and what is left to do where.
    links:
      - { label: "#25", url: "https://github.com/Marceltov/questlog/issues/25" }
      - { label: "V1", url: "https://questlog.marceltov.de/values/" }

  # ---- done ------------------------------------------------------------------------------------------------------------
  - id: goals
    status: done
    date: 2026-10-30
    icon: flag-checkered
    title: Goals and the character
    summary: Long-term goals apart from what happened, in order, reached on their own when the stats get there, suggestions kept apart until agreed; the character is the playthrough's and can go along to NG+.
    links:
      - { label: "PR", url: "https://github.com/Marceltov/questlog/pulls" }
      - { label: "ADR 0009", url: "https://questlog.marceltov.de/adr/0009-goals-and-the-character/" }

  - id: trilium-import
    status: done
    date: 2026-10-30
    icon: import
    title: The Lies of P log from Trilium
    summary: The quest log, build and mechanics pages Claude kept in Trilium, filed through record as the first playthrough, each page word for word as a session's transcript.
    links:
      - { label: "#8", url: "https://github.com/Marceltov/questlog/issues/8" }
      - { label: "V3", url: "https://questlog.marceltov.de/values/#v3-your-progress-your-words" }

  - id: lookups
    status: done
    date: 2026-10-30
    icon: web
    title: Claude looks things up
    summary: questlog keeps the sites you trust for a game and the facts Claude found there, with their links; Claude does the reading, questlog never fetches.
    links:
      - { label: "#22", url: "https://github.com/Marceltov/questlog/pull/22" }
      - { label: "ADR 0008", url: "https://questlog.marceltov.de/adr/0008-claude-looks-things-up/" }
      - { label: "V6", url: "https://questlog.marceltov.de/values/#v6-your-state-not-the-internets" }

  - id: rest-api
    status: done
    date: 2026-10-30
    icon: api
    title: The REST API
    summary: /api/v1 over the same domain, with tokens bound to it, and the OpenAPI description generated from its route table.
    links:
      - { label: "#21", url: "https://github.com/Marceltov/questlog/pull/21" }
      - { label: "ADR 0007", url: "https://questlog.marceltov.de/adr/0007-rest-api-tokens/" }
      - { label: "V5", url: "https://questlog.marceltov.de/values/#v5-claude-first" }

  - id: page-turns
    status: done
    date: 2026-10-30
    icon: book-open-page-variant-outline
    title: Turn pages
    summary: One page per playthrough, swiped sideways on the phone, with a contents page first.
    links:
      - { label: "#20", url: "https://github.com/Marceltov/questlog/pull/20" }
      - { label: "V5", url: "https://questlog.marceltov.de/values/#v5-claude-first" }

  - id: more-tools
    status: done
    date: 2026-10-30
    icon: tools
    title: item, correct and missed
    summary: Compare an item with the build, fix what was filed, and a list of what you may have missed, only when you ask.
    links:
      - { label: "#19", url: "https://github.com/Marceltov/questlog/pull/19" }
      - { label: "V1", url: "https://questlog.marceltov.de/values/#v1-no-spoilers-you-didnt-ask-for" }
      - { label: "V5", url: "https://questlog.marceltov.de/values/#v5-claude-first" }

  - id: first-version
    status: done
    date: 2026-10-30
    icon: book-open-page-variant
    title: The first version
    summary: Sign-in, one log per player, the spoiler gate, the tools record, briefing and open_threads, and the image deployed with Docker Compose.
    links:
      - { label: "#9", url: "https://github.com/Marceltov/questlog/pull/9" }
      - { label: "V1", url: "https://questlog.marceltov.de/values/#v1-no-spoilers-you-didnt-ask-for" }
      - { label: "V2", url: "https://questlog.marceltov.de/values/#v2-your-log-is-yours-alone" }

  - id: design
    status: done
    date: 2026-10-30
    icon: compass-outline
    title: Values and the first decisions
    summary: What questlog stands for, and ADRs for the app, lookups and sign-in.
    links:
      - { label: "#1", url: "https://github.com/Marceltov/questlog/pull/1" }
