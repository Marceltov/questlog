# The roadmap, as data. docs_hooks/roadmap.py (from engineering-conventions, which has it from passageway) renders it as the timeline on
# the roadmap page.
#
# Open entries (status now, next, later or decide) are shown first, in the order of this file, each with a `when` label and `details`.
# Done entries are shown below them, newest date first (the order of this file breaks ties), each with a `date` and a link to its pull
# request or release.
#
# To finish a step: set `status: done`, replace `when` with `date: YYYY-MM-DD`, add the link to its pull request, and move it to the
# top of the done entries. `icon` is the name of a Material Design icon (https://pictogrammers.com/library/mdi/).
# `title_de`, `summary_de`, `when_de` and `details_de` are the German page's (docs/roadmap.de.md); English stands in where one is missing.
# `details` is a small subset of markdown: paragraphs, "- " lists, **bold**, `code` and [links](https://...).

items:
  # ---- open ------------------------------------------------------------------------------------------------------------
  - id: passkeys
    status: later
    when: Later
    when_de: Später
    icon: key-variant
    title: Passkeys and magic links
    title_de: Passkeys und Magic Links
    summary: More ways to sign in, set up while signed in; a mail still holds only a code during an MCP sign-in.
    summary_de: Mehr Wege zur Anmeldung, eingerichtet im angemeldeten Zustand; bei einer MCP-Anmeldung enthält eine Mail weiterhin nur einen Code.
    links:
      - { label: "#6", url: "https://github.com/Marceltov/questlog/issues/6" }
      - { label: "V7", url: "https://questlog.marceltov.de/values/#v7-self-hosting-has-everything" }

  # ---- done ------------------------------------------------------------------------------------------------------------
  - id: languages
    status: done
    date: 2026-10-31
    icon: translate
    title: English and German
    title_de: Englisch und Deutsch
    summary: The web app in English and German, picked from your browser or the switch in the header; the docs in German next to English.
    summary_de: Die Web-App auf Englisch und Deutsch, je nach Browser oder Umschalter in der Kopfzeile; die Doku auf Deutsch neben Englisch.
    links:
      - { label: "#29", url: "https://github.com/Marceltov/questlog/pull/29" }
      - { label: "#10", url: "https://github.com/Marceltov/questlog/issues/10" }
      - { label: "V8", url: "https://questlog.marceltov.de/values/#v8-any-game-any-language" }

  - id: tracker
    status: done
    date: 2026-10-30
    icon: sword-cross
    title: The tracker, inventory and codex
    title_de: Tracker, Inventar und Kodex
    summary: The whole inventory with counts and an item's numbers, in the game's own groups; the bosses, enemies, NPCs and places met, with weaknesses, strategies and tries; and what each item is good or bad against.
    summary_de: Das ganze Inventar mit Anzahl und den Werten eines Gegenstands, in den Gruppen des Spiels; die Bosse, Gegner, NSCs und Orte, denen du begegnet bist, mit Schwächen, Strategien und Versuchen; und wogegen jeder Gegenstand gut oder schlecht ist.
    links:
      - { label: "#24", url: "https://github.com/Marceltov/questlog/issues/24" }
      - { label: "#25", url: "https://github.com/Marceltov/questlog/issues/25" }
      - { label: "ADR 0010", url: "https://questlog.marceltov.de/adr/0010-the-tracker/" }

  - id: goals
    status: done
    date: 2026-10-30
    icon: flag-checkered
    title: Goals and the character
    title_de: Ziele und der Charakter
    summary: Long-term goals apart from what happened, in order, reached on their own when the stats get there, suggestions kept apart until agreed; the character is the playthrough's and can go along to NG+.
    summary_de: Langfristige Ziele getrennt von dem, was passiert ist, in Reihenfolge, von selbst erreicht, wenn die Werte so weit sind, Vorschläge getrennt, bis du zustimmst; der Charakter gehört zum Durchlauf und kann mit ins NG+.
    links:
      - { label: "#26", url: "https://github.com/Marceltov/questlog/pull/26" }
      - { label: "ADR 0009", url: "https://questlog.marceltov.de/adr/0009-goals-and-the-character/" }

  - id: trilium-import
    status: done
    date: 2026-10-30
    icon: import
    title: The Lies of P log from Trilium
    title_de: Das Lies-of-P-Log aus Trilium
    summary: The quest log, build and mechanics pages Claude kept in Trilium, filed through record as the first playthrough, each page word for word as a session's transcript.
    summary_de: Die Questlog-, Build- und Mechanik-Seiten, die Claude in Trilium geführt hat, über record als erster Durchlauf abgelegt, jede Seite wörtlich als Transkript einer Session.
    links:
      - { label: "#8", url: "https://github.com/Marceltov/questlog/issues/8" }
      - { label: "V3", url: "https://questlog.marceltov.de/values/#v3-your-progress-your-words" }

  - id: lookups
    status: done
    date: 2026-10-30
    icon: web
    title: Claude looks things up
    title_de: Claude schlägt nach
    summary: questlog keeps the sites you trust for a game and the facts Claude found there, with their links; Claude does the reading, questlog never fetches.
    summary_de: questlog merkt sich die Seiten, denen du für ein Spiel vertraust, und die Fakten, die Claude dort gefunden hat, mit ihren Links; Claude liest, questlog ruft nie selbst etwas ab.
    links:
      - { label: "#22", url: "https://github.com/Marceltov/questlog/pull/22" }
      - { label: "ADR 0008", url: "https://questlog.marceltov.de/adr/0008-claude-looks-things-up/" }
      - { label: "V6", url: "https://questlog.marceltov.de/values/#v6-your-state-not-the-internets" }

  - id: rest-api
    status: done
    date: 2026-10-30
    icon: api
    title: The REST API
    title_de: Die REST-API
    summary: /api/v1 over the same domain, with tokens bound to it, and the OpenAPI description generated from its route table.
    summary_de: /api/v1 über dieselbe Domäne, mit daran gebundenen Tokens, und die OpenAPI-Beschreibung aus ihrer Routentabelle erzeugt.
    links:
      - { label: "#21", url: "https://github.com/Marceltov/questlog/pull/21" }
      - { label: "ADR 0007", url: "https://questlog.marceltov.de/adr/0007-rest-api-tokens/" }
      - { label: "V5", url: "https://questlog.marceltov.de/values/#v5-claude-first" }

  - id: page-turns
    status: done
    date: 2026-10-30
    icon: book-open-page-variant-outline
    title: Turn pages
    title_de: Seiten umblättern
    summary: One page per playthrough, swiped sideways on the phone, with a contents page first.
    summary_de: Eine Seite pro Durchlauf, auf dem Handy seitlich gewischt, mit einem Inhaltsverzeichnis vorneweg.
    links:
      - { label: "#20", url: "https://github.com/Marceltov/questlog/pull/20" }
      - { label: "V5", url: "https://questlog.marceltov.de/values/#v5-claude-first" }

  - id: more-tools
    status: done
    date: 2026-10-30
    icon: tools
    title: item, correct and missed
    title_de: item, correct und missed
    summary: Compare an item with the build, fix what was filed, and a list of what you may have missed, only when you ask.
    summary_de: Einen Gegenstand mit dem Build vergleichen, Abgelegtes korrigieren, und eine Liste dessen, was du verpasst haben könntest, nur wenn du fragst.
    links:
      - { label: "#19", url: "https://github.com/Marceltov/questlog/pull/19" }
      - { label: "V1", url: "https://questlog.marceltov.de/values/#v1-no-spoilers-you-didnt-ask-for" }
      - { label: "V5", url: "https://questlog.marceltov.de/values/#v5-claude-first" }

  - id: first-version
    status: done
    date: 2026-10-30
    icon: book-open-page-variant
    title: The first version
    title_de: Die erste Version
    summary: Sign-in, one log per player, the spoiler gate, the tools record, briefing and open_threads, and the image deployed with Docker Compose.
    summary_de: Anmeldung, ein Log pro Spieler, die Spoiler-Schranke, die Werkzeuge record, briefing und open_threads, und das Image mit Docker Compose ausgerollt.
    links:
      - { label: "#9", url: "https://github.com/Marceltov/questlog/pull/9" }
      - { label: "V1", url: "https://questlog.marceltov.de/values/#v1-no-spoilers-you-didnt-ask-for" }
      - { label: "V2", url: "https://questlog.marceltov.de/values/#v2-your-log-is-yours-alone" }

  - id: design
    status: done
    date: 2026-10-30
    icon: compass-outline
    title: Values and the first decisions
    title_de: Werte und die ersten Entscheidungen
    summary: What questlog stands for, and ADRs for the app, lookups and sign-in.
    summary_de: Wofür questlog steht, und ADRs für die App, das Nachschlagen und die Anmeldung.
    links:
      - { label: "#1", url: "https://github.com/Marceltov/questlog/pull/1" }
